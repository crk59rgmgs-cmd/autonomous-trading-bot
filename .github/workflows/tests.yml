name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile-check every source file
        run: python -m compileall -q bot tests

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Smoke-test config validation (no credentials present)
        # Must exit 2 with a clear message rather than crashing.
        run: |
          set +e
          python -m bot.run_once_and_exit
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 for missing credentials, got $code"
            exit 1
          fi
          echo "Credential validation behaves correctly."
